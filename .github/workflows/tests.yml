name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run core tests
        run: python tests/test_tensorts.py

      - name: Run feature extractor tests
        run: python tests/test_feature_extractor.py

      - name: Run function transform tests
        run: python tests/test_function_transform.py

      - name: Run sklearn compat tests
        run: python tests/test_sklearn_compat_problems.py
